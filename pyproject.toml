[project]
name = "evodef-rag"
version = "0.1.0"
description = "EvoDef-RAG: Proof-Guided Self-Evolution of Defeasible Legal Memory for Auditable Statutory Reasoning"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.3",
    "openai>=1.0",
    "pydantic>=2",
    "pyyaml",
    "numpy",
    "pandas",
    "scikit-learn",
    "rank-bm25",
    "pythen",
    "scipy",
    "statsmodels",
    "matplotlib",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
faiss = ["faiss-cpu"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
