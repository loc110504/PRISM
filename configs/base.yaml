# Base configuration for EvoDef-RAG.
#
# This file is the single source of truth for paths, model tags, and
# hyperparameters shared by every script. Experiment-specific overrides live
# in configs/experiments.yaml (per-method component toggles) and
# configs/experiment_matrix.yaml (the canonical run matrix copied verbatim
# from the spec bundle).
#
# `ollama.base_url` can be overridden at runtime with the OLLAMA_HOST
# environment variable (see src/evodef/ollama_client.py) so the same config
# works against a remote Ollama server.

project: evodef_rag
seed: 20260921

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  outputs_dir: outputs
  predictions_dir: outputs/raw_predictions
  checkpoints_dir: outputs/checkpoints
  results_dir: outputs/results
  tables_dir: outputs/tables
  figures_dir: outputs/figures
  prompts_dir: prompts
  schemas_dir: schemas

models:
  generator: qwen3.5:9b
  generator_fallback: qwen3:8b
  embedder: qwen3-embedding:0.6b
  embedder_strong_optional: qwen3-embedding:4b

llm:
  # Override with LLM_PROVIDER=openai in .env to use OPENAI_API_KEY (also
  # works against an OpenAI-compatible endpoint via OPENAI_BASE_URL, e.g.
  # Together AI). Override embedder-only with LLM_EMBED_PROVIDER in .env.
  provider: ollama

ollama:
  base_url: http://localhost:11434
  temperature: 0
  max_schema_retries: 1
  request_timeout_s: 600
  # Retries on dropped connections / read timeouts (not schema failures);
  # see src/evodef/ollama_client.py OllamaClient._call_with_retry. A single
  # slow model reload or brief server hiccup should not crash a multi-hour
  # grid search or evolution run.
  max_network_retries: 2
  network_retry_backoff_s: 5.0

retrieval:
  bm25_topk: 20
  dense_topk: 20
  rrf_k: 60
  fused_topk_before_rerank: 10
  final_topk: 5
  targeted_queries_max: 3
  targeted_new_chunks_max: 3
  targeted_rounds: 1

memory:
  regression_epsilon: 0.0
  # A 25-case batch keeps replay-gated evolution tractable for the
  # budgeted 50-case run: two gate decisions rather than ten.
  gate_batch_size: 25
  gap_prune_min_trials: 3
  gap_prune_min_success_rate: 0.25

splits:
  evolution_train_fraction: 0.8
  dev_fraction: 0.2
  preserve_official_test: true
  group_by_statute_family: true

prompt_tuning:
  formalization: [F0, F1, F2, F3]
  query: [Q0, Q1, Q2]
  grounding: [G0, G1]
  objective:
    downstream_accuracy: 0.50
    retrieval_recall_at_5: 0.25
    schema_valid_rate: 0.15
    source_quote_validity: 0.10

main_methods:
  - direct_llm
  - vanilla_rag
  - prompted_rag
  - static_nesy_rag
  - evodef_full

ablations:
  - evodef_full
  - no_proof_gap
  - no_exception_query
  - no_memory
  - no_regression_gate

evolution_checkpoints: [0, 25, 50, 75, 100]

metrics:
  classification: [accuracy, macro_f1]
  retrieval: [recall_at_1, recall_at_3, recall_at_5, mrr, hit_at_5, complete_evidence_at_5]
  xai: [proof_executable_rate, source_link_coverage, counterfactual_validity, exception_coverage]
  efficiency: [llm_calls, formalization_calls, latency_s, memory_hit_rate]

statistics:
  mcnemar: true
  paired_bootstrap_resamples: 10000
  confidence_level: 0.95
